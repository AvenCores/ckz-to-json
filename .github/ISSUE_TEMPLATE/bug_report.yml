name: Сообщение об ошибке
description: Что-то работает не так
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Описание ошибки
      description: Краткое описание проблемы.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия ckz2json
      description: Вывод команды `ckz2json --version`.
      placeholder: "ckz2json 1.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: ОС и архитектура
      placeholder: "Windows 11 x64 / Ubuntu 24.04 arm64 / macOS 15"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Точные команда(ы) и действия.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Вывод консоли полностью.
      render: shell
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > Прикладывайте только зашифрованные `.ckz` или вывод программы.
        > Расшифрованный JSON с cookies может содержать активные сессии — не публикуйте его.
